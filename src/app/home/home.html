<section
  id="home"
  class="min-h-screen flex items-center px-4 sm:px-6 lg:px-8 relative overflow-hidden pt-16 sm:pt-0"
>
  <!-- Subtle background decoration -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-40">
    <div class="absolute top-1/4 right-1/4 w-64 h-64 sm:w-96 sm:h-96 bg-gray-100 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 left-1/4 w-64 h-64 sm:w-96 sm:h-96 bg-gray-50 rounded-full blur-3xl"></div>
  </div>

  <div class="max-w-6xl mx-auto text-left relative z-10 w-full">
    <!-- Main heading with typewriter -->
    <h1 class="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-bold text-black mb-6 sm:mb-8 leading-tight">
      Hello, I'm a<br />
      <span class="text-gray-700 inline-block min-w-[240px] sm:min-w-[300px] md:min-w-[500px]">
        {{ displayedText }}
        <span class="border-r-2 sm:border-r-4 border-gray-700 ml-1 animate-pulse"></span>
      </span>
    </h1>

    <!-- Description -->
    <p class="text-lg sm:text-xl md:text-2xl text-gray-600 max-w-3xl mb-8 sm:mb-10 leading-relaxed">
      Building modern applications with clean, scalable code
      and a passion for creating exceptional digital experiences.
    </p>

    <!-- CTA Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mb-10 sm:mb-12">
      <a
        href="#projects"
        class="group relative bg-black text-white px-6 sm:px-8 py-3 sm:py-4 overflow-hidden transition-all duration-300 hover:shadow-2xl hover:scale-105 text-center"
      >
        <span class="relative z-10 font-medium flex items-center justify-center gap-2">
          View My Work
          <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
          </svg>
        </span>
        <div class="absolute inset-0 bg-gray-800 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
      </a>
      
      <a
        href="#contact"
        class="border-2 border-black text-black px-6 sm:px-8 py-3 sm:py-4 hover:bg-black hover:text-white transition-all duration-300 font-medium flex items-center justify-center gap-2 text-center"
      >
        Get In Touch
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </a>
    </div>

    <!-- Status indicator -->
    <div class="flex items-center gap-4 sm:gap-6 text-gray-600">
      <div class="flex items-center gap-2">
        <div class="relative">
          <div class="w-2.5 sm:w-3 h-2.5 sm:h-3 bg-green-500 rounded-full"></div>
          <div class="absolute inset-0 w-2.5 sm:w-3 h-2.5 sm:h-3 bg-green-500 rounded-full animate-ping opacity-75"></div>
        </div>
        <span class="text-xs sm:text-sm font-medium">Available for opportunities</span>
      </div>
    </div>
  </div>

  <!-- Scroll indicator - Hidden on small screens -->
  <div class="hidden sm:flex absolute bottom-8 left-1/2 transform -translate-x-1/2 flex-col items-center gap-2 text-gray-400 animate-bounce-slow">
    <span class="text-xs uppercase tracking-wider">Scroll</span>
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </div>
</section>
