<section id="home" class="relative min-h-[100svh] flex flex-col overflow-hidden pt-16">
  <!-- Background -->
  <div
    class="absolute inset-0 bg-dot-grid mask-radial pointer-events-none"
    aria-hidden="true"
  ></div>
  <div
    class="absolute -top-40 -right-40 w-[32rem] h-[32rem] bg-gray-100 rounded-full blur-3xl opacity-70 pointer-events-none"
    aria-hidden="true"
  ></div>

  <div class="relative z-10 flex-1 flex items-center w-full px-4 sm:px-6 lg:px-8 py-14 sm:py-20">
    <div class="container-site">
      <!-- Status -->
      <div class="hero-in flex items-center gap-2.5 mb-8 text-sm font-medium text-gray-600">
        <span class="relative flex w-3 h-3">
          <span class="absolute inset-0 rounded-full bg-green-500 animate-ping-slow"></span>
          <span class="relative w-3 h-3 rounded-full bg-green-500"></span>
        </span>
        Available for opportunities
      </div>

      <!-- Heading -->
      <h1 class="hero-in font-bold tracking-tight text-black" style="--d: 80ms">
        <span class="block text-[clamp(2.25rem,12.5vw,6.5rem)] leading-[0.95] whitespace-nowrap"
          >Hi, I'm Mario.</span
        >
        <span
          class="block mt-3 sm:mt-4 text-3xl sm:text-5xl md:text-6xl text-gray-400 leading-tight min-h-[2.5em] sm:min-h-[1.25em]"
          aria-live="off"
        >
          {{ displayedText() }}<span class="caret text-black" aria-hidden="true"></span>
        </span>
      </h1>

      <!-- Description -->
      <p
        class="hero-in mt-6 text-lg sm:text-xl md:text-2xl text-gray-600 max-w-2xl leading-relaxed"
        style="--d: 160ms"
      >
        Building modern applications with clean, scalable code and a passion for creating
        exceptional digital experiences.
      </p>

      <!-- CTAs -->
      <div
        class="hero-in mt-10 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4"
        style="--d: 240ms"
      >
        <button
          type="button"
          (click)="go('projects')"
          class="group relative bg-black text-white px-7 py-4 overflow-hidden font-medium hover:shadow-2xl transition-shadow duration-300"
        >
          <span
            class="absolute inset-0 bg-gray-800 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"
          ></span>
          <span class="relative flex items-center justify-center gap-2">
            View My Work
            <svg
              class="w-5 h-5 group-hover:translate-x-1 transition-transform"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 8l4 4m0 0l-4 4m4-4H3"
              />
            </svg>
          </span>
        </button>

        <button
          type="button"
          (click)="go('contact')"
          class="border-2 border-black text-black px-7 py-[14px] font-medium flex items-center justify-center gap-2 hover:bg-black hover:text-white transition-colors duration-300"
        >
          Get In Touch
        </button>

        <!-- Socials -->
        <div class="flex items-center gap-1 sm:ml-4 justify-center sm:justify-start mt-2 sm:mt-0">
          @for (social of profile.socials; track social.type) {
            <a
              [appSocialLink]="social"
              [attr.aria-label]="social.name"
              [title]="
                social.url ? social.name : social.name + ': ' + social.copy + ' (click to copy)'
              "
              class="w-11 h-11 grid place-items-center text-gray-500 hover:text-black hover:bg-gray-100 transition-colors duration-200"
            >
              <app-social-icon [type]="social.type" />
            </a>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Tech marquee -->
  <div
    class="hero-in marquee relative z-10 border-y border-gray-200 bg-white/70 py-5 overflow-hidden mask-x"
    style="--d: 360ms"
    aria-label="Technologies I work with"
  >
    <div class="flex w-max animate-marquee">
      @for (skill of marquee; track $index) {
        <div
          class="group flex items-center gap-2.5 pr-10 shrink-0"
          [attr.aria-hidden]="$index >= marquee.length / 2"
        >
          <img
            [src]="skill.icon"
            alt=""
            [class.icon-mono]="skill.mono"
            class="w-6 h-6 object-contain grayscale opacity-60 group-hover:grayscale-0 group-hover:opacity-100 transition duration-300"
          />
          <span
            class="text-sm font-medium text-gray-500 group-hover:text-black transition-colors whitespace-nowrap"
          >
            {{ skill.name }}
          </span>
        </div>
      }
    </div>
  </div>
</section>
